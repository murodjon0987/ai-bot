services:
  - type: web
    name: jonli-xotira-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: xotira_ai_bot
      - key: PORT
        value: 10000
